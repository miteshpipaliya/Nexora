      /* First-paint desktop gate: display the actual brand before React loads.
         It is absent on touch/tablet and when intro was already completed. */
      #nx-first-paint-gate { display:none; }
      #nx-first-paint-start:focus-visible { outline:2px solid #c4b5fd; outline-offset:5px; border-radius:12px; }
      @media (min-width:1025px) and (hover:hover) and (pointer:fine) {
        html:not(.nx-intro-done):not(.nx-intro-ready) #root { visibility: hidden; }
        html:not(.nx-intro-done):not(.nx-intro-ready) #nx-first-paint-gate {
          display:flex; position:fixed; inset:0; z-index:100001;
          flex-direction:column; align-items:center; justify-content:center;
          gap:clamp(8px,2vh,24px); overflow:hidden; pointer-events:none;
          background:#020105;
        }
      }
    </style>
    <script>
      try {
        if (sessionStorage.getItem('introPlayed') === 'true' && new URLSearchParams(location.search).get('intro') !== '1') {
          document.documentElement.classList.add('nx-intro-done');
        }
      } catch (_) {}
